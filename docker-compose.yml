version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    container_name: servicehub-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: 
      context: ./frontend
    container_name: servicehub-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
